.f{max-width:560px}
.pal{max-width:420px}
}
</style>

 if(!n||!s){authMsg=msg("e","Scrivi nome e cognome.");return render()}
 var r=await sb.rpc("registra_profilo",{p_nome:n+" "+s,p_classe:c,p_torneo:t});
 if(r.error){authMsg=msg("e",r.error.message);return render()}
 authMsg="";await afterLogin(authUser)}
async function esci(){await sb.auth.signOut();location.reload()}
async function togA(e){if(!isA())return;var on=st.admins.indexOf(e)>=0;var r=await sb.rpc("imposta_ruolo",{p_email:e,p_ruolo:on?"studente":"amministratore"});if(r.error){alert(r.error.message);return}await loadT("profili");render()}
function nrm(o){var r={};Object.keys(o).sort().forEach(function(k){var c=o[k];if(!(c.t||c.bg!=null||c.fg!=null||c.b))return;r[k]=[c.t||"",c.bg==null?null:c.bg,c.fg==null?null:c.fg,!!c.b]});return JSON.stringify(r)}
function ostat(cl){var p=st.pub&&st.pub[cl];if(!p)return "Non ancora inviato agli studenti";return nrm(p.c)===nrm(cellsOf(cl))?"Inviato il "+p.t:"Modifiche non inviate (ultimo invio: "+p.t+")"}
async function inviaOrario(){if(!isA()||gp.length<2)return;var cl=gp[1];clearTimeout(pushT);while(busy)await new Promise(function(r){setTimeout(r,100)});await push();
 var r=await sb.rpc("pubblica_orario",{p_classe:cl});if(r.error){alert(r.error.message);return}await loadT("celle_pubbliche");render()}

nav();render();init();
</script>
